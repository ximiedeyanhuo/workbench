<script>
/* 防主题闪烁（FOUC）：在首帧绘制前同步应用本地缓存的主题，
   避免暗色模式用户刷新时先闪一帧亮色再切暗色。与 app.js 的
   initTheme 用同一 key（wb2_theme）与默认值（light）。 */
(function () {
  try {
    var t = localStorage.getItem("wb2_theme") || "light";
    if (t === "auto") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* 隐私模式等忽略 */ }
})();
</script>

<!-- 设计契约 · 「车站 · 到发时刻」· 二轮打磨
THESIS: 我的仪表盘是一座自托管的小站——任务即车次，打卡即检票，今日焦点即到发时刻表。拒绝"灰底卡片+蓝色 SaaS"仪表盘。
OWN-WORLD: 莫兰迪 Soft UI（治愈系）——灰蓝点状底+米白大圆角卡+低饱和暖橙，柔化拟物轻阴影；暗色为深夜灰蓝。数据一律等宽数字，弱化严肃感，传递轻松陪伴。
STORY: 每天进站：看一眼时刻表上的今日车次，检票完成事项，盖章打卡，正点出发。
FIRST VIEWPORT: 墨色站牌侧栏 · 发车广播式欢迎语 · 四张车票形统计卡（staggered 入场）· 今日焦点=到发时刻表。
FORM: 站台信息系统（assigned direction #7）
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md -->

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
  // 新版本 SW 接管（skipWaiting + clients.claim）时自动刷新一次，
  // 消除「部署后首刷拿到旧 JS、下次刷新才更新」的版本错位窗口。
  // 首次安装时 controller 由 null 变为 SW，wbHadSW 为 false，不触发刷新。
  var wbHadSW = !!navigator.serviceWorker.controller;
  var wbReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (wbHadSW && !wbReloading) { wbReloading = true; location.reload(); }
  });
}
</script>
